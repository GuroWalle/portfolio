<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guro Walle: designer</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <main class="page home-page">

            <!-- Hamburger -->
            <button 
                class="menu-button"
                @click="menuOpen = true"
            >
                <img src="assets/hamburger.svg" alt="Åpne meny">
            </button>


            <!-- Hero image -->
             <img
                class="hero-image"
                src="assets/forside/collage.png"
                alt=""
            >


            <!-- Logo -->
            <a href="index.html">
                <img 
                    class="logo"
                    src="assets/logo.svg"
                    alt="Guro Walle"
                >
            </a>

        </main>


        <!-- MENU OVERLAY -->
        <div 
            v-if="menuOpen"
            class="menu-overlay"
        >

            <a href="index.html" class="close-button">
                <img src="assets/lukke.svg" alt="Close button">
            </a>


            <nav class="menu">

                <a href="nettsider.html">
                    Nettsider
                </a>

                <a href="apper.html">
                    Apper
                </a>

                <a href="kunst.html">
                    Kunst
                </a>

                <a href="kontakt.html">
                    Kontakt
                </a>

            </nav>

        </div>

    </div>


    <!-- Vue -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        Vue.createApp({

            data() {
                return {
                    menuOpen: false
                }
            }

        }).mount('#app')
    </script>

</body>

</html>
