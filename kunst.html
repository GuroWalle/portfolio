<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guro Walle: kunst</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <main class="page">

            <!-- Hamburger -->
            <button 
                class="menu-button"
                @click="menuOpen = true"
            >
                <img src="assets/hamburger.svg" alt="Åpne meny">
            </button>


            <!-- Innhold -->
            <section class="projects">

                <!-- Christina -->
                <article class="project">

                    <img 
                        src="assets/kunst/christina.jpeg"
                        alt=""
                    >

                    <div class="project-info">

                        <h2>Christina</h2>

                        <p>
                            Inspirert av Amedeo Modiglianis,
                            "Christina", 1916 
                        </p>

                    </div>

                </article>

                <!-- Camel-->
                <article class="project">

                    <img 
                        src="assets/kunst/camel.jpeg"
                        alt=""
                    >

                    <div class="project-info">

                        <h2>Kamel</h2>

                        <p>
                            Laget med koldnål på pleksiglass. 
                        </p>

                    </div>

                </article>

                <!-- Lunia -->
                <article class="project">

                    <img 
                        src="assets/kunst/lunia.jpeg"
                        alt=""
                    >

                    <div class="project-info">

                        <h2>Lunia</h2>

                        <p>
                            Inspirert av Amedeo Modiglianis,
                            "Lunia Czechovska", 1919; Paris, France 
                        </p>

                    </div>

                </article>

            </section>


            <!-- Logo -->
            <a href="index.html">
                <img 
                    class="logo"
                    src="assets/logo.svg"
                    alt="Guro Walle"
                >
            </a>

        </main>


        <!-- MENU -->

        <div 
            v-if="menuOpen"
            class="menu-overlay"
        >

            <button 
                class="close-button"
                @click="menuOpen = false"
            >
                <img src="assets/lukke.svg" alt="Close button">
            </button>

            <nav class="menu">

                <a href="nettsider.html">
                    Nettsider
                </a>

                <a href="apper.html">
                    Apper
                </a>

                <a href="kunst.html">
                    Kunst
                </a>

                <a href="kontakt.html">
                    Kontakt
                </a>

                <a href="index.html">
                    Forside
                </a>

            </nav>

        </div>

    </div>


    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>

        Vue.createApp({

            data() {
                return {
                    menuOpen: false
                }
            }

        }).mount('#app')

    </script>

</body>

</html>
